# ============================================
# QuantumultX + OKZ 联合配置方案
# ============================================
# 工作原理：
#   互联网 → OKZ(App) (AnyTLS/Hysteria2/Trojan) 
#                 ↓ SOCKS5(6696)
#           QuantumultX
#
# 关键信息：
#   - OKZ 已启动，监听端口：6696
#   - OKZ 自动处理 Hysteria2、AnyTLS、Trojan
#   - QuantumultX 只需连接本地 SOCKS5
#
# 优势：
#   ✅ QuantumultX 支持所有协议功能（MITM、规则等）
#   ✅ OKZ 负责复杂协议的 TLS 握手和加密
#   ✅ 无需转换订阅格式
# ============================================

[Server]
# 本地中转节点（OKZ 提供的标准代理服务）
local-socks = socks5://127.0.0.1:6696

[Remote Server]
# 远程托管（如果 OKZTWO 支持的话）
# remote-okz = urlset https://... # OKZTWO 可能不支持此模式

[General]
# 本地代理设置
hostname-skip = private,localhost
skip-server = verify-cert,verify-no-cert
tfo = true

# DNS 设置
dns-server = system

[Proxy Group]
# 创建节点选择组
PROXY = select
  - local-socks
  - DIRECT

# 自动故障转移
FALLBACK = fallback
  - local-socks
  - DIRECT

[Rule]
# 基础规则
geosite-cn, DIRECT
geoip-cn, DIRECT
geosite-gf, DIRECT
geosite-google, BLOCK
geosite-netflix, PROXY
geategorie-spotify, PROXY

# 默认使用 SOCKS5 代理
*, PROXY

[MITM]
# 如果需要 MITM
trusted-cert = true
