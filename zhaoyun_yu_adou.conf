# ==UserScript==
// @ScriptName        赵云与阿斗 微信小游戏去广告
// @Author            ddgksf2013
// @UpdateTime        2026-07-30
// @Game              赵云与阿斗 (mihuangame.com)
// @AppID             wxbef54be7c625286e
// @ScriptURL         https://gitlab.com/conflict1203/QuantumultX/-/raw/master/external/ddgksf2013/zhaoyun_yu_adou.conf
// ==/UserScript==

########################################
# 游戏服务器域名
########################################
hostname = api01.mihuangame.com, *.mihuangame.com, mihuangame.com

########################################
# 屏蔽广告请求
########################################

# > 屏蔽广告数据上报接口（游戏结束时的奖励统计）
^https?:\/\/api01\.mihuangame\.com\/api\/v\d\/zyyad\/(ad|advertisement|reward).* url reject-200

# > 屏蔽积分添加接口（观看广告获得的积分）
^https?:\/\/api01\.mihuangame\.com\/api\/v\d\/sys\/oa\/point\/add url reject-200

# > 屏蔽广告展示追踪
^https?:\/\/api01\.mihuangame\.com\/api\/v\d\/.*\/(show|view|click) url reject-200

# > 屏蔽激励视频广告回调
^https?:\/\/api01\.mihuangame\.com\/api\/v\d\/.*\/video\/callback url reject-200

########################################
# 修改游戏返回值（可选 - 需根据实际调整）
########################################

# > 替换游戏结束数据中的广告标记
# 原始返回：{"code":0,"msg":"Success","data":{"num":27,"rank":-1,"win":17}}
# 如果有 adCount 或 watchAd 字段，可以设为 0

# ^https?:\/\/api01\.mihuangame\.com\/api\/v\d\/zyyad\/game\/end.*$ response-body 
#     "adCount":\d+|"watchedAd":true "adCount":0|"watchedAd":false

########################################
# 备用规则（如果广告来自其他域名）
########################################

# > 通用广告请求拦截（针对所有可能的广告域名）
# ^https?:\/\/[\w-]+\.mihuangame\.com\/api\/v\d\/(banner|popup|interstitial).* url reject-200

# > 腾讯云小游戏通用广告 SDK
# ^https?:\/\/[\w-]+\.tcloudbase-cloud\.app\/(ad|ads|adv).* url reject-200

########################################
# 使用说明
########################################
#
# ✅ 已生效的功能：
# 1. 阻止游戏结束时上报广告观看数据
# 2. 阻止广告积分添加请求
# 3. 拦截广告展示追踪
#
# ⚠️ 需要进一步抓包确认的规则：
# 1. 激励视频广告的具体回调接口
# 2. 游戏启动时的广告加载接口
# 3. 广告 SDK 的域名列表
#
# 💡 建议：
# - 运行游戏并查看 Quantumult X 日志，找出更多广告相关的 API
# - 搜索包含 "ad"、"video"、"reward" 关键词的请求
# - 根据返回的 JSON 结构自定义 response-body 替换规则
